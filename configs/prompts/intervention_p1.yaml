# Intervention Continuation P1 (Sender/Initial Prompt) Variants
#
# Each variant defines how the first prompt (P_1) before latent steps (L_1..L_T)
# is constructed in `intervention_continuation` experiments.
#
# Placeholders supported in `template`:
#   {question} - The input problem/question text from the dataset.
#
# Note: The default variant `planner` matches the original Sequential LatentMAS
# planner prompt and preserves the canonical default experiment path
# (`..._intervention_continuation`) for backward compatibility with running/completed runs.

default_system_message: "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."

variants:
  planner:
    description: "Default LatentMAS Sequential Planner prompt (outline step-by-step plan without final answer)"
    role_builder: "planner"
    template: |
      You are a Planner Agent. Given an input question, design a clear, step-by-step plan for how to solve the question.

      Question: {question}

      Your outlined plan should be concise with a few bulletpoints for each step. Do not produce the final answer.
      Now output your plan to solve the question below:

  direct_solve:
    description: "Single-agent style direct step-by-step reasoning and boxed final answer prompt"
    template: |
      Target Question: {question}

      You are a helpful assistant.

      You must reason step-by-step to solve the provided Target Question without outputting other irrelevant information.

      Now, reason step by step and output the final answer inside \boxed{{YOUR_FINAL_ANSWER}}.

  question_only:
    description: "Raw question only without role or formatting instructions"
    template: |
      Question: {question}

  latent_think:
    description: "Instruct the model to reason silently in latent steps before answering"
    template: |
      Question: {question}

      Think carefully step-by-step about how to solve this problem in your internal state before producing the final solution.

  math_agent:
    description: "Hierarchical LatentMAS style math agent prompt"
    template: |
      You are a math agent. Given the input question, reason step-by-step and put the final answer inside \boxed{{YOUR_FINAL_ANSWER}}.

      Input Question: {question}

      Your response:
