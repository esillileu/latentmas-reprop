default_system_message: "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."

condition_sets:
  rq:
    allowed: [rqe, rqle, rqlce, rqlre, rqlqe, rqlrqe, rqrqe]
    default: [rqe, rqle, rqrqe, rqlrqe]
  q:
    allowed: [qe, qle]
    default: [qe, qle]

question_template: "Question: {question}\n"

roles:
  planner:
    description: "Default LatentMAS Sequential Planner prompt (outline step-by-step plan without final answer)"
    role_builder: "planner"

  critic:
    role_builder: critic

  refiner:
    role_builder: refiner

  judger:
    role_builder: judger

  direct_solve:
    description: "Single-agent style direct step-by-step reasoning and boxed final answer prompt"
    template: |
      Target Question: {question}

      You are a helpful assistant.

      You must reason step-by-step to solve the provided Target Question without outputting other irrelevant information.

      Now, reason step by step and output the final answer inside \boxed{{YOUR_FINAL_ANSWER}}.

  latent_think:
    description: "Instruct the model to reason silently in latent steps before answering"
    template: |
      Question: {question}

      Think carefully step-by-step about how to solve this problem in your internal state before producing the final solution.

  math_agent:
    description: "Hierarchical LatentMAS style math agent prompt"
    template: |
      You are a math agent. Given the input question, reason step-by-step and put the final answer inside \boxed{{YOUR_FINAL_ANSWER}}.

      Input Question: {question}

      Your response:
